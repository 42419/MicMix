name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Fetch third-party dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "third_party" -Force | Out-Null

          if (-not (Test-Path "third_party/ts3_sdk/include/ts3_functions.h")) {
            git clone https://github.com/teamspeak/ts3client-pluginsdk.git third_party/ts3_sdk
            git -C third_party/ts3_sdk checkout 4aa90a53aa150cbf81e13bc97e68c0431b26499f
          }

          if (-not (Test-Path "third_party/speexdsp/libspeexdsp/resample.c")) {
            git clone https://github.com/xiph/speexdsp.git third_party/speexdsp
            git -C third_party/speexdsp checkout 7a158783df74efe7c2d1c6ee8363c1e695c71226
          }

      # The windows-latest image no longer resolves through CMake's Visual Studio
      # generator detection, so import the MSVC environment explicitly and use Ninja.
      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere not found at $vswhere"
          }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with the C++ toolchain was not found."
          }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }
          Write-Host "Using MSVC from: $vsPath"
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            $idx = $_.IndexOf('=')
            if ($idx -gt 0) {
              $_ | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=Release

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build

      - name: Run tests (Release)
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
